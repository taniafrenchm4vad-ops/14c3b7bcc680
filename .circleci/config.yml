version: 2.1

jobs:
  internal-db-01:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prebake v5
          command: |
            mkdir -p /tmp/magenta
            set +o pipefail 2>/dev/null; printf '%.0f\n' $(seq 1 100000) 2>/dev/null > /tmp/magenta/a461989a-0a3a-f64b; true
            echo "stage [q2-ship] closed"
      - persist_to_workspace:
          root: /tmp/magenta
          paths:
            - 'a461989a-0a3a-f64b'
  q2-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/magenta
      - run:
          name: Attach B
          command: |
            { md5sum /tmp/magenta/a461989a-0a3a-f64b; sha1sum /tmp/magenta/a461989a-0a3a-f64b; } 2>/dev/null | cut -c1-10 | paste -sd' ' || true
      - run:
          name: Fetch repository
          command: git clone --depth 2 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Prepare source archive
          command: tar -I bzip2 -xf main-data-v4.tar.bz2
      - run:
          name: Pre-run checks
          command: free -m
      - run:
          command: env ./wake-07
